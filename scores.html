<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成绩查询 | 二附化学社官网</title>
    <link rel="icon" href="images/logo.jpg" type="image/jpeg">
    <style>
        :root {
            --bg-page: #f7f8fa;
            --bg-surface: #ffffff;
            --bg-banner: #e8f2f1;
            --bg-nav-hover: #f0f4f3;
            --bg-card: #ffffff;
            --text-primary: #1a1f2e;
            --text-secondary: #4a5568;
            --text-muted: #718096;
            --text-on-banner: #0f3d3a;
            --border-light: #e2e8f0;
            --border-medium: #cbd5e0;
            --border-accent: #b2d4d2;
            --accent-teal: #0d9488;
            --accent-teal-light: #14b8a6;
            --accent-amber: #d97706;
            --space-xs: 6px;
            --space-sm: 12px;
            --space-md: 20px;
            --space-lg: 32px;
            --space-xl: 48px;
            --space-2xl: 64px;
            --font-sans: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
            --font-size-xs: 0.78rem;
            --font-size-sm: 0.88rem;
            --font-size-base: 0.98rem;
            --font-size-md: 1.08rem;
            --font-size-lg: 1.35rem;
            --font-size-xl: 2rem;
            --font-size-2xl: 2.8rem;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition-fast: 0.18s ease;
            --transition-smooth: 0.25s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html {
            scroll-behavior: smooth;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            scrollbar-gutter: stable;
        }
        body {
            font-family: var(--font-sans);
            background-color: var(--bg-page);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle, rgba(13, 148, 136, 0.06) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        /* 导航 */
        .site-header {
            position: sticky; top: 0; z-index: 1000;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-light);
            height: 62px; display: flex; align-items: center;
        }
        .header-inner {
            max-width: 1280px; width: 100%; margin: 0 auto; padding: 0 32px;
            display: flex; align-items: center; justify-content: space-between; gap: 24px; height: 100%;
        }
        .logo-area { display: flex; align-items: center; gap: 10px; flex-shrink: 0; text-decoration: none; color: var(--text-primary); }
        .logo-icon { width: 36px; height: 36px; object-fit: contain; border-radius: 6px; transition: opacity var(--transition-fast); }
        .logo-area:hover .logo-icon { opacity: 0.8; }
        .logo-text { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.3px; color: var(--text-primary); white-space: nowrap; transition: color var(--transition-fast); }
        .logo-area:hover .logo-text { color: var(--accent-teal); }
        .main-nav { display: flex; align-items: center; gap: 2px; list-style: none; height: 100%; }
        .main-nav li { height: 100%; display: flex; align-items: center; }
        .main-nav a {
            display: flex; align-items: center; padding: 8px 14px; text-decoration: none;
            color: var(--text-secondary); font-size: var(--font-size-sm); font-weight: 500;
            letter-spacing: 0.2px; border-radius: var(--radius-sm);
            border-bottom: 2px solid transparent; transition: all var(--transition-fast);
            height: 100%; position: relative; top: 1px;
        }
        .main-nav a:hover { color: var(--accent-teal); background-color: var(--bg-nav-hover); border-bottom-color: var(--accent-teal); }
        .main-nav a.nav-active { color: var(--accent-teal); border-bottom-color: var(--accent-teal); font-weight: 600; }
        .mobile-menu-trigger { display: none; background: none; border: 1px solid var(--border-light); cursor: pointer; padding: 7px 9px; flex-direction: column; gap: 4px; z-index: 1001; border-radius: var(--radius-sm); transition: border-color var(--transition-fast); }
        .mobile-menu-trigger:hover { border-color: var(--accent-teal); }
        .mobile-menu-trigger span { display: block; width: 22px; height: 2px; background: var(--text-primary); border-radius: 1px; transition: all var(--transition-fast); }

        /* 标题横幅 */
        .page-title-banner {
            position: relative; width: 100%; background-color: var(--bg-banner);
            border-bottom: 1px solid var(--border-accent); padding: 40px 36px; text-align: center;
            background-image: radial-gradient(circle at 78% 30%, rgba(13,148,136,0.05) 0%, rgba(13,148,136,0.05) 90px, transparent 91px),
                            radial-gradient(circle at 20% 60%, rgba(217,119,6,0.04) 0%, rgba(217,119,6,0.04) 50px, transparent 51px);
        }
        .page-title { font-size: var(--font-size-xl); font-weight: 800; letter-spacing: 0.6px; color: var(--text-on-banner); display: inline-block; }
        .page-title::after { content: ''; display: block; width: 50px; height: 3px; margin: 10px auto 0; background-color: var(--accent-teal-light); border-radius: 1px; opacity: 0.8; }

        /* 主内容区域 */
        .main-content {
            max-width: 1100px;
            margin: 0 auto;
            padding: var(--space-xl) 24px var(--space-2xl);
            display: flex;
            gap: 24px;
            min-height: 500px;
        }

        .exam-sidebar {
            width: 280px; /* 横向拉宽 */
            flex-shrink: 0;
            background-color: var(--bg-surface); border: 1px solid var(--border-light);
            border-radius: var(--radius-lg); padding: 16px 0;
            align-self: flex-start; position: sticky; top: 90px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
        }
        .exam-sidebar h3 {
            font-size: var(--font-size-sm); font-weight: 700;
            color: var(--text-muted); padding: 0 16px 12px;
            border-bottom: 1px solid var(--border-light); margin-bottom: 8px; letter-spacing: 0.5px;
        }
        .exam-list { list-style: none; display: flex; flex-direction: column; }
        .exam-list li a {
            display: block; padding: 10px 16px; text-decoration: none;
            color: var(--text-secondary); font-size: var(--font-size-sm);
            border-left: 3px solid transparent; transition: all var(--transition-fast);
        }
        .exam-list li a:hover { background-color: var(--bg-nav-hover); color: var(--accent-teal); border-left-color: var(--accent-teal-light); }
        .exam-list li a.active { background-color: rgba(13,148,136,0.05); color: var(--accent-teal); font-weight: 600; border-left-color: var(--accent-teal); }

        .query-area { flex: 1; min-width: 0; }
        .query-form {
            background-color: var(--bg-surface); border: 1px solid var(--border-light);
            border-radius: var(--radius-lg); padding: 28px 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02); text-align: center;
        }
        .query-form label {
            display: block; font-size: var(--font-size-sm); font-weight: 600;
            color: var(--text-primary); margin-bottom: 6px; text-align: left;
        }
        .query-form input {
            width: 100%; padding: 10px 14px; border: 1px solid var(--border-light);
            border-radius: var(--radius-sm); font-size: var(--font-size-base);
            background: var(--bg-page); color: var(--text-primary);
            outline: none; transition: border-color var(--transition-fast); margin-bottom: 18px;
        }
        .query-form input:focus { border-color: var(--accent-teal); }
        .query-btn {
            background: var(--accent-teal); color: #fff; border: none;
            padding: 12px 32px; border-radius: 20px; font-size: var(--font-size-base);
            font-weight: 600; cursor: pointer; transition: background var(--transition-fast);
            letter-spacing: 0.5px;
        }
        .query-btn:hover { background: var(--accent-teal-light); }
        .query-btn:disabled { background: #ccc; cursor: not-allowed; }
        .error-msg { color: #c44; font-size: var(--font-size-sm); margin-top: 12px; display: none; }
        .select-hint { font-size: var(--font-size-sm); color: var(--text-muted); margin-top: 8px; }

        /* 弹窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); z-index: 9999;
            display: none; justify-content: center; align-items: center;
            overflow-y: auto; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-dialog {
            background: white; max-width: 720px; width: 100%;
            border-radius: var(--radius-lg);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
            overflow: hidden;
            animation: modalPop 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 90vh;
            display: flex; flex-direction: column;
        }
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.92) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; border-bottom: 1px solid var(--border-light);
        }
        .modal-exam-name {
            font-size: var(--font-size-md); font-weight: 700;
            color: var(--text-primary);
        }
        .modal-close {
            background: none; border: none; font-size: 1.5rem; cursor: pointer;
            color: var(--text-muted); line-height: 1; padding: 4px;
            transition: color var(--transition-fast);
        }
        .modal-close:hover { color: var(--accent-amber); }
        .modal-body {
            padding: 20px 24px 28px;
            overflow-y: auto; flex: 1;
        }
        .score-total {
            font-size: var(--font-size-2xl);
            font-weight: 800;
            color: var(--accent-teal);
            text-align: center;
            margin-bottom: 20px;
        }
        .sheet-block { margin-bottom: 24px; }
        .sheet-title {
            font-size: var(--font-size-lg); font-weight: 700;
            color: var(--text-primary); margin-bottom: 10px;
        }
        .table-wrapper {
            width: 100%;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            overflow: hidden;
        }
        .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            border: none;
            font-size: var(--font-size-sm);
            table-layout: fixed;
        }
        .table-wrapper td {
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
            text-align: center;
            word-break: break-word;
        }
        .score-note {
            font-size: var(--font-size-sm); color: var(--text-muted);
            margin-top: 12px; font-style: italic;
        }

        .modal-loading {
            display: flex; justify-content: center; align-items: center;
            padding: 40px 0;
        }
        .loading-spinner {
            width: 36px; height: 36px;
            border: 3px solid var(--border-light);
            border-top-color: var(--accent-teal);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .site-footer { border-top: 1px solid var(--border-light); padding: 24px 32px; max-width: 1280px; margin: 0 auto; }
        .footer-inner { display: flex; justify-content: flex-start; align-items: center; }
        .copyright { font-size: var(--font-size-xs); color: var(--text-muted); letter-spacing: 0.2px; }

        /* 响应式 */
        @media (max-width: 820px) {
            .site-header { height: 54px; }
            .header-inner { padding: 0 14px; }
            .main-nav {
                position: fixed; top: 54px; left: 0; right: 0; background-color: var(--bg-surface);
                flex-direction: column; padding: 8px 0; gap: 0; border-bottom: 1px solid var(--border-light);
                transform: translateY(-120%); transition: transform var(--transition-smooth);
                z-index: 999; height: auto;
            }
            .main-nav.mobile-open { transform: translateY(0); }
            .main-nav li { width: 100%; height: auto; }
            .main-nav a { padding: 12px 20px; font-size: var(--font-size-sm); width: 100%; border-bottom: none; border-left: 3px solid transparent; border-radius: 0; top: 0; }
            .main-nav a:hover { border-left-color: var(--accent-teal); border-bottom-color: transparent; background-color: var(--bg-nav-hover); }
            .main-nav a.nav-active { border-left-color: var(--accent-teal); border-bottom-color: transparent; }
            .mobile-menu-trigger { display: flex; }
            .page-title-banner { padding: 32px 24px; }
            .page-title { font-size: 1.6rem; }
            .main-content { flex-direction: column; padding: var(--space-lg) 16px var(--space-2xl); }
            .exam-sidebar { width: 100%; position: static; margin-bottom: 20px; }
            .exam-list { flex-direction: row; flex-wrap: wrap; gap: 4px; padding: 8px; }
            .exam-list li a { border-left: none; border-radius: 20px; padding: 6px 14px; font-size: var(--font-size-xs); border: 1px solid var(--border-light); }
            .exam-list li a.active { background-color: var(--accent-teal); color: #fff; border-color: var(--accent-teal); }
            .logo-icon { width: 28px; height: 28px; }
            .logo-text { font-size: 0.92rem; }
        }
        @media (max-width: 480px) {
            .site-header { height: 48px; }
            .header-inner { padding: 0 10px; gap: 8px; }
            .main-nav { top: 48px; }
            .page-title { font-size: 1.3rem; }
            .main-content { padding: var(--space-md) 12px var(--space-xl); }
            .query-form { padding: 20px 16px; }
            .modal-body { padding: 16px; }
            .logo-icon { width: 24px; height: 24px; }
            .logo-text { font-size: 0.82rem; }
            .site-footer { padding: 14px 14px; }
        }
    </style>
</head>
<body>
    <div class="site-wrapper">
        <header class="site-header">
            <div class="header-inner">
                <a href="index.html" class="logo-area" aria-label="Chem Club Homepage">
                    <img src="images/logo.jpg" alt="Fun Chemistry" class="logo-icon">
                    <span class="logo-text">Fun Chemistry</span>
                </a>
                <nav>
                    <ul class="main-nav" id="mainNav">
                        <li><a href="index.html">Home 主页</a></li>
                        <li><a href="aboutus.html">About us 关于我们</a></li>
                        <li><a href="chemclub.html">Chem Club 化学社团</a></li>
                        <li><a href="chemacademy.html">Chem Academy 化学学科活动</a></li>
                        <li><a href="dcc.html">DCC-Daily Chem Club</a></li>
                        <li><a href="scores.html" class="nav-active">Grade Inquiry 成绩查询</a></li>
                    </ul>
                </nav>
                <button class="mobile-menu-trigger" id="mobileMenuTrigger" aria-label="Toggle navigation menu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </header>

        <section class="page-title-banner">
            <h1 class="page-title">Grade Inquiry 成绩查询</h1>
        </section>

        <div class="main-content">
            <aside class="exam-sidebar">
                <h3>查询列表</h3>
                <ul class="exam-list" id="examList">
                    <li style="padding:10px 16px; color:var(--text-muted); font-size:var(--font-size-sm);">加载中...</li>
                </ul>
            </aside>
            <div class="query-area">
                <div class="query-form">
                    <label for="inputName">姓名</label>
                    <input type="text" id="inputName" placeholder="请输入姓名" autocomplete="off">
                    <label for="inputPwd">密钥</label>
                    <input type="password" id="inputPwd" placeholder="请输入密钥" autocomplete="off">
                    <button class="query-btn" id="queryBtn" disabled>请先选择查询项目</button>
                    <p class="error-msg" id="errorMsg">姓名或密钥错误，请重试</p>
                    <p class="select-hint" id="selectHint">请在左侧选择一个查询项目</p>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-dialog">
                <div class="modal-header">
                    <span class="modal-exam-name" id="modalExamName">成绩单</span>
                    <button class="modal-close" id="modalClose">&times;</button>
                </div>
                <div class="modal-body" id="modalBody">
                    <div class="modal-loading">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="site-footer">
            <div class="footer-inner">
                <p class="copyright">© 2026 Fun Chemistry</p>
            </div>
        </footer>
    </div>

    <script>
        (function() {
            const trigger = document.getElementById('mobileMenuTrigger');
            const nav = document.getElementById('mainNav');
            if (trigger && nav) {
                trigger.addEventListener('click', () => nav.classList.toggle('mobile-open'));
                nav.querySelectorAll('a').forEach(link => link.addEventListener('click', () => nav.classList.remove('mobile-open')));
                document.addEventListener('click', (e) => { if (!trigger.contains(e.target) && !nav.contains(e.target)) nav.classList.remove('mobile-open'); });
            }

            const examList = document.getElementById('examList');
            const queryBtn = document.getElementById('queryBtn');
            const inputName = document.getElementById('inputName');
            const inputPwd = document.getElementById('inputPwd');
            const errorMsg = document.getElementById('errorMsg');
            const selectHint = document.getElementById('selectHint');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalClose = document.getElementById('modalClose');
            const modalBody = document.getElementById('modalBody');
            const modalExamName = document.getElementById('modalExamName');

            let currentExamData = null;
            let currentExamName = '';
            let examFileMap = new Map();

            function closeModal() {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }
            modalClose.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal(); });

            function parseScoreRecords(text) {
                const records = [];
                const regex = /<scr>(.*?)<\/scr>/gs;
                let match;
                while ((match = regex.exec(text)) !== null) {
                    const block = match[1];
                    const record = { name: '', pwd: '', total: '', sheets: [], note: '' };
                    const fieldRegex = /\{([^}]+)\}/g;
                    let fieldMatch;
                    while ((fieldMatch = fieldRegex.exec(block)) !== null) {
                        const content = fieldMatch[1].trim();
                        const eqIndex = content.indexOf('=');
                        if (eqIndex === -1) continue;
                        const key = content.substring(0, eqIndex).trim();
                        const value = content.substring(eqIndex + 1).trim();
                        switch (key) {
                            case 'name': record.name = value; break;
                            case 'pwd': record.pwd = value; break;
                            case 'title': record.total = value; break;
                            case 'sheet':
                                const firstBracket = value.indexOf('[');
                                if (firstBracket === -1) break;
                                const title = value.substring(0, firstBracket).trim();
                                const rowsStr = value.substring(firstBracket);
                                const rowRegex = /\[([^\]]*)\]/g;
                                const rows = [];
                                let rowMatch;
                                while ((rowMatch = rowRegex.exec(rowsStr)) !== null) {
                                    rows.push(rowMatch[1].split(',').map(cell => cell.trim()));
                                }
                                record.sheets.push({ title, rows });
                                break;
                            case 'note': record.note = value; break;
                        }
                    }
                    if (record.name) records.push(record);
                }
                return records;
            }

            function buildSheetTable(rows) {
                const maxCols = Math.max(...rows.map(r => r.length), 1);
                let html = '<table>';
                rows.forEach(row => {
                    html += '<tr>';
                    for (let i = 0; i < maxCols; i++) {
                        if (i < row.length) {
                            html += `<td>${row[i]}</td>`;
                        } else {
                            html += `<td></td>`;
                        }
                    }
                    html += '</tr>';
                });
                html += '</table>';
                return html;
            }

            function buildModalContent(record, examName) {
                let html = `<div class="score-total">${record.total}</div>`;
                record.sheets.forEach(sheet => {
                    html += `<div class="sheet-block">`;
                    html += `<div class="sheet-title">${sheet.title}</div>`;
                    html += `<div class="table-wrapper">${buildSheetTable(sheet.rows)}</div>`;
                    html += `</div>`;
                });
                if (record.note) {
                    html += `<div class="score-note">${record.note}</div>`;
                }
                return html;
            }

            function showScore(record) {
                modalBody.innerHTML = '<div class="modal-loading"><div class="loading-spinner"></div></div>';
                modalExamName.textContent = currentExamName || '成绩单';
                modalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';

                setTimeout(() => {
                    modalBody.innerHTML = buildModalContent(record, currentExamName);
                }, 300);
            }

            async function selectExam(fileName, linkElement) {
                document.querySelectorAll('.exam-list a').forEach(a => a.classList.remove('active'));
                linkElement.classList.add('active');
                try {
                    const resp = await fetch(`scores/${fileName}`);
                    if (!resp.ok) throw new Error('加载失败');
                    const text = await resp.text();
                    currentExamData = parseScoreRecords(text);
                    currentExamName = linkElement.textContent.trim();
                    queryBtn.disabled = false;
                    queryBtn.textContent = '查询成绩';
                    selectHint.style.display = 'none';
                    errorMsg.style.display = 'none';
                } catch (e) {
                    alert('数据加载失败，请稍后重试');
                }
            }

            async function loadExamList() {
                try {
                    const listResp = await fetch('scores/list.txt');
                    if (!listResp.ok) throw new Error('list.txt not found');
                    const listText = await listResp.text();
                    const fileNames = listText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
                    examList.innerHTML = '';
                    for (const fileName of fileNames) {
                        try {
                            const resp = await fetch(`scores/${fileName}`);
                            const text = await resp.text();
                            const testnameMatch = text.match(/<testname>(.*?)<\/testname>/);
                            const examName = testnameMatch ? testnameMatch[1].trim() : fileName;
                            examFileMap.set(examName, fileName);
                            const li = document.createElement('li');
                            const a = document.createElement('a');
                            a.href = '#';
                            a.textContent = examName;
                            a.addEventListener('click', (e) => { e.preventDefault(); selectExam(fileName, a); });
                            li.appendChild(a);
                            examList.appendChild(li);
                        } catch (e) { console.error(`加载 ${fileName} 失败`, e); }
                    }
                    if (examList.children.length === 0) {
                        examList.innerHTML = '<li style="padding:10px 16px; color:var(--text-muted); font-size:var(--font-size-sm);">暂无可查询的项目</li>';
                    }
                } catch (e) {
                    examList.innerHTML = '<li style="padding:10px 16px; color:var(--text-muted); font-size:var(--font-size-sm);">查询列表加载失败</li>';
                }
            }

            async function performQuery() {
                const name = inputName.value.trim();
                const pwd = inputPwd.value.trim();
                errorMsg.style.display = 'none';
                if (!name || !pwd) { errorMsg.textContent = '请输入姓名和密钥'; errorMsg.style.display = 'block'; return; }
                if (!currentExamData) { errorMsg.textContent = '请先在左侧选择一个查询项目'; errorMsg.style.display = 'block'; return; }
                const found = currentExamData.find(r => r.name === name && r.pwd === pwd);
                if (found) {
                    showScore(found);
                    errorMsg.style.display = 'none';
                } else {
                    errorMsg.textContent = '姓名或密钥错误，请重试';
                    errorMsg.style.display = 'block';
                }
            }

            queryBtn.addEventListener('click', performQuery);
            inputPwd.addEventListener('keypress', (e) => { if (e.key === 'Enter') performQuery(); });
            loadExamList();
        })();
    </script>
</body>
</html>
