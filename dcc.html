<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC | 二附化学社官网</title>
        <link rel="icon" href="images/logo.jpg" type="image/jpeg">
    <style>
        /* ========================================
           Bright Futuristic / Cyber Tech design theme
           SHSBNU DCC - Daily Chem Club
           ======================================== */

        :root {
            /* 亮色未来风背景 */
            --bg-page: #f4f7fc;
            --bg-surface: #ffffff;
            --bg-banner: #eef3fa;
            --bg-nav-hover: #e6f0f8;
            --bg-card: #ffffff;

            /* 亮色未来风文字 */
            --text-primary: #0f1a2e;
            --text-secondary: #2e405b;
            --text-muted: #5a6c82;
            --text-on-banner: #0d2137;
            --text-on-banner-secondary: #1e3a55;

            /* 亮色边框 */
            --border-light: #cfdeed;
            --border-medium: #b0c8e0;
            --border-accent: #8ab3d9;

            /* 霓虹强调色（调亮但保留科技感） */
            --accent-teal: #0099dd;
            --accent-teal-light: #33bbff;
            --accent-amber: #aa44ff;
            --accent-amber-light: #cc77ff;
            --safety-blue: #0077cc;

            /* 间距与其他页面完全一致 */
            --space-xs: 6px;
            --space-sm: 12px;
            --space-md: 20px;
            --space-lg: 32px;
            --space-xl: 48px;
            --space-2xl: 64px;

            /* 科技感字体 */
            --font-sans: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
            --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
            --font-size-xs: 0.78rem;
            --font-size-sm: 0.88rem;
            --font-size-base: 0.98rem;
            --font-size-md: 1.08rem;
            --font-size-lg: 1.35rem;
            --font-size-xl: 2rem;

            --radius-xs: 2px;
            --radius-sm: 3px;
            --radius-md: 4px;
            --radius-lg: 8px;

            --transition-fast: 0.18s ease;
            --transition-smooth: 0.25s ease;

            /* 柔和发光阴影 */
            --glow-cyan: 0 0 10px rgba(0, 153, 221, 0.25);
            --glow-purple: 0 0 10px rgba(170, 68, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-page);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
            /* 亮色科技网格背景 */
            background-image:
                /* 细网格线 */
                repeating-linear-gradient(0deg, rgba(0,153,221,0.06) 0px, rgba(0,153,221,0.06) 1px, transparent 1px, transparent 40px),
                repeating-linear-gradient(90deg, rgba(0,153,221,0.06) 0px, rgba(0,153,221,0.06) 1px, transparent 1px, transparent 40px),
                /* 柔和光晕 */
                radial-gradient(ellipse at 50% 30%, rgba(0,180,255,0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 20% 80%, rgba(150,80,255,0.04) 0%, transparent 50%);
            background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%;
            background-position: center;
            background-repeat: repeat, repeat, no-repeat, no-repeat;
        }

        /* ========================================
           HEADER
           ======================================== */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-light);
            height: 62px;
            display: flex;
            align-items: center;
            box-shadow: 0 0 16px rgba(0, 150, 220, 0.06);
        }

        .header-inner {
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            height: 100%;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            text-decoration: none;
            color: var(--text-primary);
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            object-fit: contain;
            border: none;
            border-radius: 6px;
            transition: opacity var(--transition-fast), filter var(--transition-fast);
            filter: drop-shadow(0 0 5px rgba(0,153,221,0.3));
        }

        .logo-area:hover .logo-icon {
            opacity: 0.8;
            filter: drop-shadow(0 0 10px rgba(0,153,221,0.6));
        }

        .logo-text {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            color: var(--text-primary);
            white-space: nowrap;
            transition: color var(--transition-fast), text-shadow var(--transition-fast);
        }

        .logo-area:hover .logo-text {
            color: var(--accent-teal);
            text-shadow: 0 0 8px rgba(0,153,221,0.25);
        }

        .main-nav {
            display: flex;
            align-items: center;
            gap: 2px;
            list-style: none;
            flex-wrap: nowrap;
            height: 100%;
        }

        .main-nav li {
            height: 100%;
            display: flex;
            align-items: center;
        }

        .main-nav a {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
            font-weight: 500;
            letter-spacing: 0.3px;
            white-space: nowrap;
            border-radius: var(--radius-xs);
            border-bottom: 2px solid transparent;
            transition: all var(--transition-fast);
            height: 100%;
            position: relative;
            top: 1px;
        }

        .main-nav a:hover {
            color: var(--accent-teal);
            background-color: var(--bg-nav-hover);
            border-bottom-color: var(--accent-teal);
            text-shadow: 0 0 6px rgba(0,153,221,0.15);
        }

        .main-nav a.nav-active {
            color: var(--accent-teal);
            border-bottom-color: var(--accent-teal);
            font-weight: 600;
            text-shadow: 0 0 8px rgba(0,153,221,0.25);
        }

        .mobile-menu-trigger {
            display: none;
            background: none;
            border: 1px solid var(--border-light);
            cursor: pointer;
            padding: 7px 9px;
            flex-direction: column;
            gap: 4px;
            z-index: 1001;
            border-radius: var(--radius-xs);
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .mobile-menu-trigger:hover {
            border-color: var(--accent-teal);
            box-shadow: 0 0 8px rgba(0,153,221,0.2);
        }

        .mobile-menu-trigger span {
            display: block;
            width: 22px;
            height: 2px;
            background: var(--text-primary);
            border-radius: 1px;
            transition: all var(--transition-fast);
        }

        /* ========================================
           PAGE TITLE BANNER
           ======================================== */
        .page-title-banner {
            position: relative;
            width: 100%;
            background-color: var(--bg-banner);
            border-bottom: 1px solid var(--border-accent);
            padding: 44px 36px;
            text-align: center;
            background-image:
                /* 科技六边形网格（浅色） */
                repeating-linear-gradient(60deg, transparent, transparent 15px, rgba(0,153,221,0.04) 15px, rgba(0,153,221,0.04) 16px),
                repeating-linear-gradient(-60deg, transparent, transparent 15px, rgba(0,153,221,0.04) 15px, rgba(0,153,221,0.04) 16px),
                /* 光晕 */
                radial-gradient(circle at 70% 30%, rgba(0,180,255,0.08) 0%, transparent 60%);
            background-size: 100% 100%, 100% 100%, 100% 100%;
            background-position: center;
            background-repeat: repeat, repeat, no-repeat;
            box-shadow: inset 0 0 30px rgba(0, 120, 200, 0.04);
        }

        .page-title-banner::before {
            content: '';
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            bottom: 14px;
            border: 1px solid rgba(0, 153, 221, 0.25);
            pointer-events: none;
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(0, 153, 221, 0.05);
        }

        .page-title {
            font-size: var(--font-size-xl);
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--text-on-banner);
            position: relative;
            display: inline-block;
            text-shadow: 0 0 12px rgba(0, 153, 221, 0.2);
        }

        .page-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 2px;
            margin: 14px auto 0;
            background-color: var(--accent-teal);
            border-radius: 1px;
            opacity: 0.8;
            box-shadow: 0 0 6px rgba(0,153,221,0.4);
        }

        /* ========================================
           MAIN CONTENT AREA
           ======================================== */
        .main-content {
            max-width: 960px;
            margin: 0 auto;
            padding: var(--space-xl) 36px var(--space-2xl);
            min-height: 600px;
        }

        /* 亮色未来风内容卡片 */
        .future-card {
            border: 1px solid var(--border-accent);
            background-color: var(--bg-card);
            border-radius: 4px;
            padding: 28px 32px;
            text-align: center;
            color: var(--text-secondary);
            font-family: var(--font-sans);
            position: relative;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.5px;
            box-shadow: 0 0 20px rgba(0, 140, 220, 0.06);
            background-image:
                /* 四角发光点 */
                radial-gradient(circle at 0 0, rgba(0,153,221,0.15) 8px, transparent 8px),
                radial-gradient(circle at 100% 0, rgba(170,68,255,0.12) 8px, transparent 8px),
                radial-gradient(circle at 0 100%, rgba(170,68,255,0.12) 8px, transparent 8px),
                radial-gradient(circle at 100% 100%, rgba(0,153,221,0.15) 8px, transparent 8px);
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        .future-card::before,
        .future-card::after {
            content: '⬡';
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.3rem;
            color: var(--accent-teal);
            background: var(--bg-page);
            padding: 0 8px;
            text-shadow: 0 0 8px rgba(0,153,221,0.5);
        }

        .future-card::after {
            top: auto;
            bottom: -14px;
            color: var(--accent-amber);
            text-shadow: 0 0 8px rgba(170,68,255,0.5);
        }

        /* ========================================
           FOOTER
           ======================================== */
        .site-footer {
            position: relative;
            z-index: 2;
            border-top: 1px solid var(--border-light);
            padding: 24px 32px;
            max-width: 1280px;
            margin: 0 auto;
        }

        .footer-inner {
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .copyright {
            font-size: var(--font-size-xs);
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }

        /* ========================================
           RESPONSIVE
           ======================================== */
        @media (max-width: 1050px) {
            .header-inner {
                padding: 0 18px;
                gap: 14px;
            }
            .main-nav a {
                padding: 6px 9px;
                font-size: var(--font-size-xs);
            }
            .logo-text {
                font-size: 1rem;
            }
            .logo-icon {
                width: 30px;
                height: 30px;
            }
            .page-title-banner {
                padding: 34px 24px;
            }
            .main-content {
                padding: var(--space-lg) 24px var(--space-xl);
                min-height: 500px;
            }
            .future-card {
                padding: 20px 24px;
            }
        }

        @media (max-width: 820px) {
            .site-header {
                height: 54px;
            }
            .header-inner {
                padding: 0 14px;
            }
            .main-nav {
                position: fixed;
                top: 54px;
                left: 0;
                right: 0;
                background-color: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                flex-direction: column;
                padding: 8px 0;
                gap: 0;
                border-bottom: 1px solid var(--border-light);
                transform: translateY(-120%);
                transition: transform var(--transition-smooth);
                z-index: 999;
                height: auto;
                box-shadow: 0 0 16px rgba(0, 120, 200, 0.08);
            }
            .main-nav.mobile-open {
                transform: translateY(0);
            }
            .main-nav li {
                width: 100%;
                height: auto;
            }
            .main-nav a {
                padding: 12px 20px;
                font-size: var(--font-size-sm);
                width: 100%;
                border-bottom: none;
                border-left: 3px solid transparent;
                border-radius: 0;
                top: 0;
            }
            .main-nav a:hover {
                border-left-color: var(--accent-teal);
                border-bottom-color: transparent;
                background-color: var(--bg-nav-hover);
            }
            .main-nav a.nav-active {
                border-left-color: var(--accent-teal);
                border-bottom-color: transparent;
            }
            .mobile-menu-trigger {
                display: flex;
            }
            .page-title {
                font-size: 1.6rem;
            }
            .main-content {
                padding: var(--space-md) 18px var(--space-lg);
                min-height: 400px;
            }
            .site-footer {
                padding: 18px 18px;
            }
            .logo-icon {
                width: 28px;
                height: 28px;
            }
            .logo-text {
                font-size: 0.92rem;
            }
            .future-card {
                padding: 18px 20px;
                min-height: 150px;
            }
        }

        @media (max-width: 480px) {
            .site-header {
                height: 48px;
            }
            .header-inner {
                padding: 0 10px;
                gap: 8px;
            }
            .main-nav {
                top: 48px;
            }
            .page-title {
                font-size: 1.3rem;
            }
            .page-title-banner {
                padding: 26px 16px;
            }
            .main-content {
                padding: var(--space-sm) 12px var(--space-lg);
                min-height: 300px;
            }
            .logo-icon {
                width: 24px;
                height: 24px;
            }
            .logo-text {
                font-size: 0.82rem;
            }
            .site-footer {
                padding: 14px 14px;
            }
            .future-card {
                padding: 16px 16px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="site-wrapper">
        <!-- ===== HEADER WITH LOGO & NAVIGATION ===== -->
        <header class="site-header">
            <div class="header-inner">
                <a href="index.html" class="logo-area" aria-label="Chem Club Homepage">
                    <img src="images/logo.jpg" alt="Fun Chemistry" class="logo-icon">
                    <span class="logo-text">Fun Chemistry</span>
                </a>

                <nav>
                    <ul class="main-nav" id="mainNav">
                        <li><a href="index.html">Home 主页</a></li>
                        <li><a href="aboutus.html">About us 关于我们</a></li>
                        <li><a href="chemclub.html">Chem Club 化学社团</a></li>
                        <li><a href="chemacademy.html">Chem Academy 化学学科活动</a></li>
                        <li><a href="dcc.html" class="nav-active">DCC-Daily Chem Club</a></li>
                        <li><a href="scores.html">Grade Inquiry 成绩查询</a></li>
                    </ul>
                </nav>

                <button class="mobile-menu-trigger" id="mobileMenuTrigger" aria-label="Toggle navigation menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </header>

        <!-- ===== PAGE TITLE BANNER ===== -->
        <section class="page-title-banner" aria-label="Page title">
            <h1 class="page-title">DCC-Daily Chem Club</h1>
        </section>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="main-content">
            <div class="future-card">
                <span>⚡ Daily Chem Club 内容即将上线</span>
            </div>
        </main>

        <!-- ===== FOOTER ===== -->
        <footer class="site-footer">
            <div class="footer-inner">
                <p class="copyright">© 2026 Fun Chemistry</p>
            </div>
        </footer>
    </div>

    <script>
        (function() {
            var trigger = document.getElementById('mobileMenuTrigger');
            var nav = document.getElementById('mainNav');
            if (trigger && nav) {
                trigger.addEventListener('click', function() {
                    nav.classList.toggle('mobile-open');
                });
                var navLinks = nav.querySelectorAll('a');
                navLinks.forEach(function(link) {
                    link.addEventListener('click', function() {
                        nav.classList.remove('mobile-open');
                    });
                });
                document.addEventListener('click', function(e) {
                    if (!trigger.contains(e.target) && !nav.contains(e.target)) {
                        nav.classList.remove('mobile-open');
                    }
                });
            }
        })();
    </script>
</body>
</html>
